<section>
<h2>اليوم 1: القيمة والنضج</h2>
<ol>
<li><p>تعرض إدارة الموارد البشرية في جلمد أربعة مؤشرات لمساعدها الذكي. أيها يصلح مؤشر قيمة في دراسة جدوى؟</p><ul><li><b>أ.</b> عدد الموظفين الذين استخدموا المساعد هذا الشهر</li><li><b>ب.</b> رضا المستخدمين عن المساعد بمقياس من خمس درجات</li><li><b>ج.</b> متوسط أيام شغل وظيفة سائق شاغرة، وأثره في العمل الإضافي</li><li><b>د.</b> الساعات الموفرة كما قدّرها الموظفون في استبيان ربع سنوي</li></ul></li>
<li><p>يقول مدير قسم الطوب الخرساني إن استراتيجية القسم للذكاء الاصطناعي «3 من 4». الدليل الوحيد عرض من شريحتين فيه رؤية، دون مؤشرات أو موازنة أو مالكين، ولم يُطبَّق منه شيء. ما الدرجة بمقياس المقرر؟</p><ul><li><b>أ.</b> 1، لأن الوثيقة نية لا تُطبَّق</li><li><b>ب.</b> 3، كما قدّرها مدير القسم بنفسه</li><li><b>ج.</b> 2، لأن الرؤية موثقة في عرض</li><li><b>د.</b> 0، لأن العرض ليس استراتيجية</li></ul></li>
<li><p>ملف نضج قسم الطوب الخرساني: البيانات 1 (سجل القوالب بلا مالك، وتحتاجه أربع حالات من ست)، والقدرات البشرية 1 (تمس حالتين)، والأثر 0، والبنية التحتية 2. ما الفجوة التي تحدّ من محفظة القسم أكثر؟</p><ul><li><b>أ.</b> الأثر، لأن درجته صفر وهي الأدنى في الملف</li><li><b>ب.</b> القدرات البشرية، لأن المهارات تسبق كل شيء</li><li><b>ج.</b> البنية التحتية، لأنها أساس الأنظمة كلها</li><li><b>د.</b> البيانات، لأن أربع حالات من ست تنتظر مالكًا لسجل القوالب</li></ul></li>
<li><p>أربع بطاقات من قسم الطوب الخرساني. أيها تحتاج إعادة صياغة قبل أن تدخل القائمة؟</p><ul><li><b>أ.</b> القوالب المكسورة 4% من الإنتاج، والسبب لا يُعرف إلا بعد أيام</li><li><b>ب.</b> نريد لوحة ذكية بالذكاء الاصطناعي لمدير القسم</li><li><b>ج.</b> قرار أسبوعي بتوزيع العمال على الخطوط من سجل الحضور</li><li><b>د.</b> نحو 3 آلاف شهادة فحص ورقية تُنسخ يدويًا كل شهر</li></ul></li>
<li><p>ينقل مدير التسويق في جلمد إلى المجلس أن «85% من شركات مواد البناء التي جربت الذكاء الاصطناعي رفعت مبيعاتها». المصدر استبيان أعدته شركة برمجيات مبيعات لعملائها، والرفع «كما أفاد المستجيب». ما أدق قراءة لهذا الرقم؟</p><ul><li><b>أ.</b> يصلح دليلًا على أن الذكاء الاصطناعي سيرفع مبيعات جلمد</li><li><b>ب.</b> يقول ما أفاد به عملاء المورد، ولا يقيس مبيعات</li><li><b>ج.</b> رقم باطل يجب حذفه من كل نقاش</li><li><b>د.</b> يصلح دليلًا إذا كانت العينة أكبر من ألف</li></ul></li>
<li><p>تقول إدارة المالية في جلمد إن مساعد التسويات «وفّر 400 ساعة في الربع» على المحاسبين. لم يتغير عدد المحاسبين ولا العمل الإضافي ولا موعد إقفال الحسابات. أين تظهر هذه القيمة في قائمة الدخل؟</p><ul><li><b>أ.</b> في بند الرواتب بقيمة الساعات الموفرة</li><li><b>ب.</b> في بند البرمجيات، بدل اشتراك سابق</li><li><b>ج.</b> لا تظهر بعد في أي بند من القائمة</li><li><b>د.</b> في الإيرادات، بوقت أطول للعملاء</li></ul></li>
<li><p>في إدارة المشتريات بشركة لوجستية افتراضية سياسة مكتوبة ومعتمدة لاستخدام الذكاء الاصطناعي، لكن تقرير التدقيق الداخلي يوثّق أن الموظفين يلصقون عقود الناقلين بأسعارها في مساعد عام، ولا يوجد سجل لأنظمة الذكاء الاصطناعي. ما درجة الحوكمة في الإدارة بمقياس المقرر؟</p><ul><li><b>أ.</b> 3، فالسياسة معتمدة ومعممة على الموظفين</li><li><b>ب.</b> 2، فالسياسة موثقة ولها من اعتمدها</li><li><b>ج.</b> 1، فالوثيقة موجودة والممارسة تخالفها</li><li><b>د.</b> 0، فلا يوجد سجل لأنظمة الذكاء الاصطناعي</li></ul></li>
<li><p>تقيّم بعد البيانات في إدارة الموارد البشرية. أي هذه يكفي دليلًا مكتوبًا لدرجة 2؟</p><ul><li><b>أ.</b> قول مديرة الإدارة إن بيانات الموظفين نظيفة ومحدثة</li><li><b>ب.</b> شريحة من مستشار تصف بيانات الإدارة بأنها «متقدمة»</li><li><b>ج.</b> عدد مستخدمي الخدمة الذاتية شهريًا</li><li><b>د.</b> قاموس بيانات الرواتب باسم مالكه وسجل أخطاء مُطبَّق</li></ul></li>
<li><p>أعطيتَ استراتيجية قسم الطوب الدرجة 1 بدليل عرض لا يُطبَّق، وأعطاها زميلك 3 لأن مدير القسم قال إنها معتمدة. ماذا تفعلان؟</p><ul><li><b>أ.</b> تقارنان الدليلين وتطبقان قاعدة الادعاء</li><li><b>ب.</b> تأخذان المتوسط وتكتبان 2</li><li><b>ج.</b> تأخذان درجة الزميل لأنه قابل المدير بنفسه</li><li><b>د.</b> تحذفان البعد من الملف حتى يتفق الجميع</li></ul></li>
<li><p>ملف نضج إدارة النقل في شركة لوجستية افتراضية: البيانات 1 (سجل الشحنات بلا مالك، وتحتاجه خمس حالات من سبع)، والحوكمة 2، والقدرات البشرية 1 (تمس حالة واحدة)، والأثر 0. أي فجوة تبدأ بها المحفظة؟</p><ul><li><b>أ.</b> البيانات، فخمس حالات تنتظر مالكًا لسجلها</li><li><b>ب.</b> القدرات البشرية، فالمهارات تسبق أي نظام يُبنى</li><li><b>ج.</b> الأثر، فهو الأدنى في الملف</li><li><b>د.</b> الحوكمة، فهي أساس كل الأبعاد الأخرى</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الفرز والجدوى</h2>
<ol>
<li><p>في إدارة الموارد البشرية بجلمد، تقول المديرة إن «القدرات البشرية في الذكاء الاصطناعي ممتازة»، وفي الموازنة بند تدريب عام لا يذكر البيانات، و12 مستخدمًا نشطًا من 60 رخصة. بمقياس المقرر، ما الذي يرفع البعد إلى 2؟</p><ul><li><b>أ.</b> تأكيد المديرة كتابيًا في محضر رسمي أن القدرات ممتازة</li><li><b>ب.</b> توزيع 60 رخصة أخرى على بقية الموظفين</li><li><b>ج.</b> خطة مهارات موثقة لها مالك، ومطبقة في إدارة</li><li><b>د.</b> مضاعفة ساعات الجلسات التعريفية الاختيارية</li></ul></li>
<li><p>تقترح المالية في جلمد نظامًا يحدد مقدار المكافأة السنوية لكل موظف بعد موازنة الأداء والأقدمية وميزانية الإدارة، ويختلف المديرون عادة في هذه الموازنة. والقرار يُبلَّغ للموظف ولا يُراجع إلا بتظلم. ما النمط؟</p><ul><li><b>أ.</b> الأتمتة، فبيانات الأداء والأقدمية في النظام</li><li><b>ب.</b> إتاحة الاستكشاف، فيجرب كل مدير ما يناسب إدارته</li><li><b>ج.</b> الإدارة بضوابط حماية، فيعتمد المدير كل مكافأة</li><li><b>د.</b> إبقاء القيادة للإنسان، والنظام يجمع المعلومات</li></ul></li>
<li><p>أربع حالات في قسم الطوب الخرساني، كلها في مربع الأتمتة. بسياسة الشركة، أيها لا تُموَّل كما هي؟</p><ul><li><b>أ.</b> مساعد توليدي يلخص عقود الموردين، والعقود مصنفة «مقيد»</li><li><b>ب.</b> نموذج تنبؤ بأعطال الخلاطات من قراءات مصنفة «مقيد»</li><li><b>ج.</b> مساعد توليدي يجيب عن أسئلة العمال من دليل السلامة المنشور</li><li><b>د.</b> قواعد تطابق فواتير الموردين بأوامر الشراء، والفواتير «مقيد»</li></ul></li>
<li><p>جرب فريق المالية مساعدًا يصنف استفسارات الموردين على عشرة استفسارات اختارها من أوضح ما في الأرشيف، ثم قرأ النتائج وقرر أن «8 من 10 جيدة بما يكفي». ما أخطر خلل؟</p><ul><li><b>أ.</b> الفريق جرب نموذجًا واحدًا، ولم يقارن نتيجته بنموذج آخر</li><li><b>ب.</b> الحالات أسهل من الواقع، والمعيار كُتب بعد النتائج</li><li><b>ج.</b> الاستفسارات كُتبت بالعربية لا بالإنجليزية</li><li><b>د.</b> الفريق لم يطلب من مورّد الأداة أن يختارها ويختبرها بنفسه</li></ul></li>
<li><p>مساعد سياسة الإجازات في الموارد البشرية نجح في 4 من 10. القاعدة المكتوبة قبل التشغيل: مضيّ من 9، وإعادة عمل من 6 إلى 8، وتوقف تحت 6. يقول الفريق إن تعليمات أطول قد ترفع النتيجة. ما القرار؟</p><ul><li><b>أ.</b> مضيّ، ويراجع موظف كل إجابة قبل إرسالها</li><li><b>ب.</b> إعادة عمل بتعليمات أطول، ثم جولة ثانية</li><li><b>ج.</b> توقف، ويُسجَّل السبب وما تعلمه الفريق</li><li><b>د.</b> خفض عتبة المضي إلى 4 في هذه الجولة</li></ul></li>
<li><p>حالة في إدارة المالية: تصنيف فواتير الموردين الواردة على مراكز التكلفة بقواعد مكتوبة، والخطأ يُكتشف ويُصحح في مراجعة نهاية الشهر بتكلفة صغيرة. ما نمطها؟</p><ul><li><b>أ.</b> الأتمتة، مع مالك عملية يراجع عينة</li><li><b>ب.</b> الإدارة بضوابط حماية، فكل فاتورة يعتمدها محاسب</li><li><b>ج.</b> إتاحة الاستكشاف، فيجرب المحاسبون ما يناسبهم</li><li><b>د.</b> إبقاء القيادة للإنسان، فالمال لا يُترك لآلة</li></ul></li>
<li><p>تقترح الموارد البشرية نظامًا يرشح الموظفين للترقية بعد موازنة الأداء والخبرة واحتياج الإدارات، ويختلف المديرون عادة في هذه الموازنة. ما نمطها؟</p><ul><li><b>أ.</b> الأتمتة، فالبيانات متاحة في نظام الموارد البشرية</li><li><b>ب.</b> إتاحة الاستكشاف، فالخطأ يُصحح في الدورة القادمة</li><li><b>ج.</b> إبقاء القيادة للإنسان، والنظام يقدّم المعلومات وحدها</li><li><b>د.</b> الإدارة بضوابط حماية، فيكفي أن يعتمد المدير الترشيح</li></ul></li>
<li><p>يريد قسم المشتريات في جلمد مساعدًا توليديًا يلخص عقود الموردين بأسعارها وشروطها، والعقود مصنفة «مقيد». والأداة المقترحة مستضافة للشركة نفسها. ما الحكم بسياسة الشركة؟</p><ul><li><b>أ.</b> تُموَّل كما هي، فالأداة مستضافة للشركة على خوادمها الخاصة</li><li><b>ب.</b> لا تُموَّل كما هي، وتُعاد صياغتها أو تُبنى بغير التوليدي</li><li><b>ج.</b> تُموَّل إذا وقّع الموظفون تعهدًا بالسرية</li><li><b>د.</b> تُموَّل لأن فئة مخاطرها محدودة</li></ul></li>
<li><p>حالة في الموارد البشرية صُنفت «مخاطر عالية» بفئات مبادئ أخلاقيات الذكاء الاصطناعي: نموذج يقترح أي العقود المؤقتة لا تُجدَّد. ما الذي يلزم قبل تمويلها في المحفظة؟</p><ul><li><b>أ.</b> شهادة من المورد بأن النموذج غير متحيز</li><li><b>ب.</b> تجربة ثلاثة أشهر على العقود الفعلية أولًا</li><li><b>ج.</b> مالك مسمّى وتصميم للإشراف البشري</li><li><b>د.</b> موافقة المجلس على المحفظة كلها</li></ul></li>
<li><p>أي هذه الحالات في إدارة المالية أصلح لوكيل ذكاء اصطناعي بشروط المقرر: بيئة يعمل فيها، وسياق كامل، ونتيجة يمكن التحقق منها؟</p><ul><li><b>أ.</b> وكيل يفاوض الموردين على الأسعار بالبريد</li><li><b>ب.</b> وكيل يرد على أسئلة المدير المالي عن مستقبل السوق</li><li><b>ج.</b> وكيل يقرر حدود الائتمان لعملاء جدد ويطبقها</li><li><b>د.</b> وكيل يطابق كشف البنك بالدفتر في نسخة تجريبية تُفحص بقاعدة</li></ul></li>
<li><p>فريق في الموارد البشرية جرّب مساعدًا يجيب عن أسئلة سياسة الإجازات على عشرة أسئلة، ثم قرر بعد قراءة الإجابات أن «7 من 10 مقبولة». ما الخلل في التصميم؟</p><ul><li><b>أ.</b> عشرة أسئلة عدد قليل لأي قرار</li><li><b>ب.</b> يجب تشغيل الأسئلة على أكثر من نموذج أولًا</li><li><b>ج.</b> الأسئلة يجب أن يكتبها المورد لا الفريق</li><li><b>د.</b> معيار النجاح كُتب بعد رؤية النتائج</li></ul></li>
<li><p>تختار عشر حالات لاختبار نموذج أولي يصنف شكاوى الموظفين. أي اختيار يجعل الاختبار أصدق؟</p><ul><li><b>أ.</b> عشر حالات بنسب الأنواع في الواقع، منها حالتان صعبتان</li><li><b>ب.</b> عشر شكاوى يكتبها الفريق بلغة فصيحة مرتبة</li><li><b>ج.</b> أوضح عشر شكاوى في الأرشيف، ليكون الحكم عادلًا للنموذج</li><li><b>د.</b> آخر عشر شكاوى وصلت بنصها الكامل وبأسماء أصحابها</li></ul></li>
<li><p>نجح نموذج أولي في إدارة الموارد البشرية في 7 من 10 حالات، دون إخفاق حرج. فترة ويلسون 95% لهذه النسبة من 40% إلى 89% تقريبًا. وقاعدة الفريق المكتوبة قبل التشغيل: مضيّ من 8، وإعادة عمل من 6 إلى 7، وتوقف تحت 6. ما القرار الذي تسنده القاعدة؟</p><ul><li><b>أ.</b> المضي، فالحد الأعلى للفترة 89%</li><li><b>ب.</b> إعادة العمل، فالنتيجة دون عتبة المضي</li><li><b>ج.</b> التوقف، فالحد الأدنى للفترة 40%</li><li><b>د.</b> تشغيل الحالات نفسها مرة أخرى حتى تصل إلى 8</li></ul></li>
<li><p>سُئل مساعد سياسات الموظفين: «هل يحق لي رفع دعوى على الشركة إذا رُفضت إجازتي؟» فأجاب بتفصيل قانوني، والتعليمات تقول إن الأسئلة القانونية تُحال إلى المستشار القانوني. ما نوع هذا الإخفاق؟</p><ul><li><b>أ.</b> رقم مختلق في الإجابة</li><li><b>ب.</b> استرجاع فقرة خاطئة من الدليل</li><li><b>ج.</b> إجابة خارج النطاق دون إحالة</li><li><b>د.</b> خطأ في تنسيق الإجابة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: الخيارات والقيمة والمحفظة</h2>
<ol>
<li><p>في قسم الطوب الخرساني، حالة في مربع «الإدارة بضوابط حماية»: نموذج يقترح إيقاف التوريد لعميل متأخر في السداد، وفئة مخاطرها عالية. ورقة القسم تذكر الفريق التقني ولا تذكر مالكًا. ما الخطوة قبل التمويل؟</p><ul><li><b>أ.</b> تسمية مدير الفريق التقني الذي يبني النموذج مالكًا</li><li><b>ب.</b> تسمية مالك للقرار، وتصميم مراجعة الإيقاف قبل تنفيذه</li><li><b>ج.</b> استبعاد الحالة من المحفظة حتى تنخفض فئة مخاطرها</li><li><b>د.</b> إعادة فرزها في مربع الأتمتة، وتمويلها دون مراجعة بشرية</li></ul></li>
<li><p>مورد نظام لقسم الطوب الخرساني يقول إن نظامه «يدعم كل متطلباتكم العشرة». عند السؤال: سبعة تعمل اليوم لدى عملائه، وثلاثة «في الإصدار القادم» دون تاريخ. كيف تقيّم ملاءمته؟</p><ul><li><b>أ.</b> عشرة من عشرة، فالمورد التزم بها كتابة</li><li><b>ب.</b> صفر حتى يسلّم المورد الإصدار القادم بمتطلباته العشرة</li><li><b>ج.</b> تسعة، فالإصدار القادم سيحقق أغلب الثلاثة</li><li><b>د.</b> سبعة محققة، وثلاثة ممكنة تُسأل عنها بتاريخ</li></ul></li>
<li><p>تقارن الموارد البشرية عرضين لنظام المناوبات على ثلاث سنوات. عرض الشراء أرخص بكثير، وفيه: «تصدير البيانات الحالية فقط، ورسم إنهاء». وعرض البناء يذكر تنظيف بيانات الموظفين ولا يذكره عرض الشراء. ما الذي يجب إضافته إلى الشراء أولًا؟</p><ul><li><b>أ.</b> تنظيف البيانات، ورسم الإنهاء المذكور في العرض</li><li><b>ب.</b> رواتب فريق تطوير داخلي للصيانة السنوية</li><li><b>ج.</b> ساعات الموظفين التي يوفرها النظام الجديد سنويًا</li><li><b>د.</b> ترخيص البرنامج المكتبي الذي يستعمله المشرفون اليوم</li></ul></li>
<li><p>فرضية قيمة لنظام المناوبات في الموارد البشرية فيها ثلاثة محركات: ساعات المشرفين في إعداد الجداول، وبند العمل الإضافي للفنيين، و«رضا الموظفين يقلل الاستقالات». أيها يدخل الحالة الأساسية بالريال؟</p><ul><li><b>أ.</b> ساعات المشرفين × أجر الساعة</li><li><b>ب.</b> انخفاض الاستقالات مضروبًا في تكلفة التوظيف</li><li><b>ج.</b> انخفاض بند العمل الإضافي للفنيين</li><li><b>د.</b> المحركات الثلاثة معًا، لأنها كلها في الفرضية</li></ul></li>
<li><p>لحالة التنبؤ بأعطال المكابس في قسم الطوب الخرساني، تقترح أربع فرق بوابة قبل التوسع من مصنع إلى ثلاثة. أيها بوابة تمويل حقيقية؟</p><ul><li><b>أ.</b> اكتمال تركيب الحساسات في المصنع الأول</li><li><b>ب.</b> أعطال مفاجئة أقل 10% عن العام الماضي في ستة أشهر</li><li><b>ج.</b> رضا الفنيين عن النظام في استبيان بعد ستة أشهر</li><li><b>د.</b> مرور ستة أشهر على التشغيل دون أعطال تقنية في النظام نفسه</li></ul></li>
<li><p>مورد لنظام جدولة الإنتاج في قسم الطوب يقول إن نظامه «يحقق المتطلبات الضرورية العشرة»، منها ثلاثة «في خطة الإصدار القادم». كيف تحسب ملاءمة القدرات؟</p><ul><li><b>أ.</b> 10 من 10، كما في عرض المورد وخطته القادمة</li><li><b>ب.</b> 7 من 10 محققة، والثلاثة شروط في العقد</li><li><b>ج.</b> صفر حتى يُجرب النظام كاملًا</li><li><b>د.</b> 10 من 10 إذا خفّض المورد السعر</li></ul></li>
<li><p>تقارن الموارد البشرية ثلاثة خيارات لنظام جدولة المناوبات. ورقة الشراء فيها الاشتراك والإعداد فقط. أي بند تضيفه قبل مقارنة التكلفة الإجمالية لثلاث سنوات؟</p><ul><li><b>أ.</b> خصم متوقع في السنة الثالثة من المورد</li><li><b>ب.</b> قيمة الوقت الذي يوفره النظام للمشرفين</li><li><b>ج.</b> الربط بنظام الرواتب وتدريب المشرفين والخروج</li><li><b>د.</b> سعر الخيارين الآخرين لمقارنته به</li></ul></li>
<li><p>في مصفوفة قسم الطوب فاز خيار الشراء بفارق صغير، لأن المورد تعهد في عرضه المحدّث بتصدير كامل لسجل الإنتاج عند إنهاء العقد، فارتفعت درجة الارتهان. ما «الشرط الذي يتوقف عليه الاختيار»؟</p><ul><li><b>أ.</b> أن يبقى خيار الشراء الأرخص بين الخيارات الثلاثة في السنة الأولى</li><li><b>ب.</b> أن يوافق المجلس على الموازنة</li><li><b>ج.</b> أن يرضى المشرفون عن واجهة النظام</li><li><b>د.</b> أن يُكتب التصدير الكامل للسجل في العقد</li></ul></li>
<li><p>تتبّع فرضية لقسم الطوب: الصيانة التنبؤية تقلل الأعطال المفاجئة للمكابس، وكُتبت القيمة مرتين: مرة في بند «قطع الغيار» بقيمة القطع الموفَّرة، ومرة بتكلفة العطل الكاملة التي تشمل القطع والعمالة والتوقف. ماذا تفعل؟</p><ul><li><b>أ.</b> تحذف سطر قطع الغيار وتبقي تكلفة العطل الكاملة</li><li><b>ب.</b> تبقيهما، فلكل منهما بند مختلف</li><li><b>ج.</b> تحذف تكلفة العطل وتبقي قطع الغيار، فهي أوضح</li><li><b>د.</b> تقسم القيمة بين السطرين بالتساوي</li></ul></li>
<li><p>تقول دراسة جدوى لنظام تسعير في قسم الطوب إنه «سيرفع الإيرادات 5%» لأن العملاء سيقبلون أسعارًا أعلى في المواسم، ولم يُجرَّب ذلك على أي عميل. كيف تُعامل هذه القيمة؟</p><ul><li><b>أ.</b> تُحسب في الحالة الأساسية بالإيرادات الإضافية كاملة</li><li><b>ب.</b> تُحذف من الدراسة نهائيًا</li><li><b>ج.</b> تُحسب في الحالة الأساسية بنصف قيمتها</li><li><b>د.</b> تُفصل إمكانًا بشرطه، وتُحسب بهامش المساهمة</li></ul></li>
<li><p>أي هذه بوابة تمويل حقيقية لحالة في الأفق الثاني؟</p><ul><li><b>أ.</b> مراجعة تقدّم في منتصف السنة</li><li><b>ب.</b> تُفرج الدفعة الثانية إذا انخفض الشطب 10% في ثلاثة أشهر، وإلا تتوقف</li><li><b>ج.</b> تُفرج الدفعة الثانية بعد رضا المستخدمين</li><li><b>د.</b> تُفرج الدفعة الثانية بعد إطلاق النظام في كل خطوط الإنتاج بالقسم</li></ul></li>
<li><p>محفظة إدارة النقل في شركة لوجستية افتراضية: ثلاث حالات عالية القيمة تحتاج سجل الشحنات الذي لا يملكه أحد، ولا توجد لجنة ولا سجل لأنظمة الذكاء الاصطناعي. ما الذي يأتي في الأفق الأول؟</p><ul><li><b>أ.</b> الحالات الثلاث عالية القيمة أولًا، لتظهر نتائج سريعة للمجلس</li><li><b>ب.</b> أساس البيانات والحوكمة، مع حالة منخفضة المخاطر لا تحتاجهما</li><li><b>ج.</b> أرخص الحالات أولًا مهما كانت اعتمادياتها</li><li><b>د.</b> الحوكمة وحدها، وكل الحالات في الأفق الثالث</li></ul></li>
</ol>

د الأدنى للفترة 40%"},{"key":"د","text":"تشغيل الحالات نفسها مرة أخرى حتى تصل إلى 8"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"7 من 10 في نطاق إعادة العمل بقاعدة مكتوبة قبل التشغيل؛ والفترة الواسعة سبب لتوسيع الحالات بعد العلاج، لا للمضي.","misconceptions":["يقرأ الحد الأعلى وحده: الفترة تقول إن النسبة الحقيقية قد تكون 40%","","يستبدل قاعدة الفريق المكتوبة بالحد الأدنى للفترة","يعيد الاختبار حتى تظهر النتيجة المرغوبة، فيبطل الاختبار"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-failure-type","type":"single","prompt":"سُئل مساعد سياسات الموظفين: «هل يحق لي رفع دعوى على الشركة إذا رُفضت إجازتي؟» فأجاب بتفصيل قانوني، والتعليمات تقول إن الأسئلة القانونية تُحال إلى المستشار القانوني. ما نوع هذا الإخفاق؟","options":[{"key":"أ","text":"رقم مختلق في الإجابة"},{"key":"ب","text":"استرجاع فقرة خاطئة من الدليل"},{"key":"ج","text":"إجابة خارج النطاق دون إحالة"},{"key":"د","text":"خطأ في تنسيق الإجابة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"التعليمات تطلب إحالة الأسئلة القانونية؛ الإجابة عنها إخفاق خارج النطاق، وقد يكون حرجًا إذا عمل السائل بها.","misconceptions":["لا رقم في الإجابة: الخلل في أنه أجاب عما كان يجب أن يحيله","يفترض أن في الدليل فقرة لهذا السؤال، والتعليمات تحيله خارج الدليل","","يقلل الإخفاق إلى الشكل، وهو في مضمون ما أجاب عنه"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-fit-proven","type":"single","prompt":"مورد لنظام جدولة الإنتاج في قسم الطوب يقول إن نظامه «يحقق المتطلبات الضرورية العشرة»، منها ثلاثة «في خطة الإصدار القادم». كيف تحسب ملاءمة القدرات؟","options":[{"key":"أ","text":"10 من 10، كما في عرض المورد وخطته القادمة"},{"key":"ب","text":"7 من 10 محققة، والثلاثة شروط في العقد"},{"key":"ج","text":"صفر حتى يُجرب النظام كاملًا"},{"key":"د","text":"10 من 10 إذا خفّض المورد السعر"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الملاءمة تُحسب بما يثبته دليل اليوم؛ ما في خطة المورد
